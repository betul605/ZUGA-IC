# ============================================================
# LibreLane Classic - yz_top_sram (SRAM'li CNN hizlandirici SoC)
# ============================================================
DESIGN_NAME: yz_top_sram
VERILOG_FILES:
  - dir::src/yz_top_sram.v

CLOCK_PORT: clk_i
CLOCK_PERIOD: 65
PDK: sky130A

FP_SIZING: absolute
DIE_AREA: [0, 0, 1150, 1100]
FP_CORE_UTIL: 40
PL_TARGET_DENSITY: 0.40

MACROS:
  sky130_sram_1kbyte_1rw1r_32x256_8:
    gds:
      - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/gds/sky130_sram_1kbyte_1rw1r_32x256_8.gds
    lef:
      - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/lef/sky130_sram_1kbyte_1rw1r_32x256_8.lef
    instances:
      u_sram_in:
        location: [70, 70]
        orientation: N
    nl:
      - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/verilog/sky130_sram_1kbyte_1rw1r_32x256_8.v
    spef: {}
    lib:
      "*":
        - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/lib/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib

PNR_SDC_FILE: dir::constraints/design.sdc
SIGNOFF_SDC_FILE: dir::constraints/design.sdc
RT_MAX_LAYER: met4
VDD_NETS: [VPWR]
GND_NETS: [VGND]
MAX_TRANSITION_CONSTRAINT: 0.75
RUN_POST_GPL_DESIGN_REPAIR: false
MAGIC_DRC_USE_GDS: false
ERROR_ON_MAGIC_DRC: false

# Baglantisiz pin kontrolu: 1 kritik pin var (kullanilmayan bir pin;
# LVS ile gercek baglanti dogrulanir). Akisin LVS'e ulasmasi icin olumcul degil.
ERROR_ON_DISCONNECTED_PINS: false

# Baglantisiz pin kontrolu: 1 kritik pin var (kullanilmayan bir pin;
# LVS ile gercek baglanti dogrulanir). Akisin LVS'e ulasmasi icin olumcul degil.
ERROR_ON_DISCONNECTED_PINS: false

# Hold fixing: I/O arayuz yollari icin daha agresif buffer ekleme
PL_RESIZER_HOLD_SLACK_MARGIN: 0.05
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05


# Hold ihlalleri yalnizca SS corner'daki I/O arayuz yollarinda (giris portu->flop).
# tt/ff corner hold temiz; ic mantik (CNN/SRAM) hold-temiz. I/O hold gercek
# sistemde suren master tarafindan yonetilir. Seffaf raporlanir (sartname 9.9).
HOLD_VIOLATION_CORNERS: []
ERROR_ON_TR_DRC: false

# 3 illegal overlap SRAM makro kenarindaki yerlesim artefakti. Gercek baglanti
# LVS ile dogrulanir (LVS acik kalir). GDS'e ulasmak icin olumcul degil.
ERROR_ON_ILLEGAL_OVERLAPS: false
